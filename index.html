<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Developer Workshop Registration</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="form-container">
    <h1>Developer Workshop Registration</h1>

    <form id="registration-form">

      <div class="form-group">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" required>
      </div>

      <div class="form-group">
        <label for="experience">Experience Level</label>
        <select id="experience">
          <option>Beginner</option>
          <option>Intermediate</option>
          <option>Advanced</option>
        </select>
      </div>

      <div class="form-group">
        <p>Workshop Track</p>
        <div class="radio-group">
          <label for="frontend"><input type="radio" id="frontend" name="track"> Frontend Web</label>
          <label for="backend"><input type="radio" id="backend" name="track"> Backend APIs</label>
          <label for="uiux"><input type="radio" id="uiux" name="track"> UI/UX Design</label>
        </div>
      </div>

      <div class="form-group">
        <input type="checkbox" id="updates">
        <label for="updates">Receive event updates</label>
      </div>

      <button type="submit">Register Now</button>

    </form>
  </div>

</body>
</html>
